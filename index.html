<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Video Creator — AI広告動画メーカー</title>
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/brand/logo.png" />
    <style>
      /*
       * 最初の読み込み画面。画面のプログラム（JS）が届く前から出し、React も同じ見た目のまま引き継ぐ（src/editor/components/Splash.tsx）。
       * 色は styles.css の --bg / --text と同じ
       */
      html, body { height: 100%; margin: 0; }
      body { background: #f5f5f7; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic UI', Meiryo, sans-serif; -webkit-font-smoothing: antialiased; }
      @media (prefers-color-scheme: dark) { body { background: #1e1e20; color: #f5f5f7; } }
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; line-height: 1.4; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic UI', Meiryo, sans-serif; }
      .boot-name { line-height: 1.25; }
      .boot-logo { width: 76px; height: 76px; border-radius: 19px; display: block; box-shadow: 0 12px 32px rgba(190, 0, 20, 0.28), 0 2px 6px rgba(0, 0, 0, 0.12); animation: boot-pop 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.25) both; }
      .boot-name { margin-top: 20px; font-size: 24px; font-weight: 700; letter-spacing: -0.015em; animation: boot-fade 0.5s 0.08s ease-out both; }
      .boot-sub { margin-top: 5px; font-size: 13px; opacity: 0.55; animation: boot-fade 0.5s 0.14s ease-out both; }
      .boot-bar { position: relative; width: 168px; height: 3px; margin-top: 30px; border-radius: 3px; background: rgba(118, 118, 128, 0.18); overflow: hidden; animation: boot-fade 0.5s 0.2s ease-out both; }
      .boot-bar::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 42%; border-radius: 3px; background: linear-gradient(90deg, #b1000a, #f40928); animation: boot-slide 1.25s cubic-bezier(0.45, 0, 0.25, 1) infinite; }
      .boot-msg { margin-top: 14px; min-height: 18px; max-width: 420px; font-size: 12.5px; line-height: 1.6; opacity: 0.6; white-space: pre-line; }
      .boot-ver { position: fixed; bottom: 18px; left: 0; right: 0; font-size: 11px; opacity: 0.35; font-variant-numeric: tabular-nums; }
      /* React が引き継いだあと（出てくる動きは繰り返さない） */
      .boot.handoff .boot-logo, .boot.handoff .boot-name, .boot.handoff .boot-sub, .boot.handoff .boot-bar { animation: none; }
      /* つながらない時 */
      .boot.boot-failed .boot-logo { animation: none; filter: grayscale(0.6); opacity: 0.8; box-shadow: none; }
      .boot-err { margin-top: 26px; max-width: 440px; font-size: 13.5px; line-height: 1.7; }
      .boot-err b { display: block; font-size: 16px; margin-bottom: 6px; }
      .boot-detail { margin-top: 8px; font-size: 11.5px; opacity: 0.5; word-break: break-all; }
      .boot-btn { margin-top: 20px; height: 34px; padding: 0 18px; border: 0; border-radius: 9px; background: #0071e3; color: #fff; font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; }
      .boot-btn:hover { background: #0077ed; }
      .boot-actions { display: flex; gap: 8px; justify-content: center; }
      .boot-btn.quiet { background: rgba(118, 118, 128, 0.16); color: inherit; }
      .boot-btn.quiet:hover { background: rgba(118, 118, 128, 0.24); }
      @media (prefers-color-scheme: dark) { .boot-btn:not(.quiet) { background: #0a84ff; } }
      @keyframes boot-slide { from { transform: translateX(-105%); } to { transform: translateX(245%); } }
      @keyframes boot-pop { from { opacity: 0; transform: scale(0.82); } to { opacity: 1; transform: none; } }
      @keyframes boot-fade { from { opacity: 0; transform: translateY(4px); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-logo, .boot-name, .boot-sub, .boot-bar { animation: none; }
        .boot-bar::after { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <img class="boot-logo" src="/brand/logo.png" alt="" width="76" height="76" />
        <div class="boot-name">Video Creator</div>
        <div class="boot-sub">AI広告動画メーカー</div>
        <div class="boot-bar"></div>
        <div class="boot-msg" id="boot-msg">読み込んでいます…</div>
      </div>
    </div>
    <script>
      // 通信が遅い時は、待っていることを伝える（画面のプログラムが届けば React が置き換える）
      setTimeout(function () {
        var m = document.getElementById('boot-msg');
        if (m) m.textContent = '読み込みに時間がかかっています…';
      }, 8000);
    </script>
    <script type="module" src="/src/editor/main.tsx"></script>
  </body>
</html>
